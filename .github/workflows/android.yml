name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # 저장소 Secrets에 키가 등록돼 있으면 정식 키로 서명 (없으면 디버그 키)
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ADSHIELD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "ADSHIELD_STORE_FILE=release.jks" >> "$GITHUB_ENV"
          fi
      - name: Test & build
        env:
          ADSHIELD_STORE_PASSWORD: ${{ secrets.ADSHIELD_STORE_PASSWORD }}
          ADSHIELD_KEY_ALIAS: ${{ secrets.ADSHIELD_KEY_ALIAS }}
          ADSHIELD_KEY_PASSWORD: ${{ secrets.ADSHIELD_KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease
      - name: Remove signing key
        if: always()
        run: rm -f release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: AdShield-apk
          path: android/app/build/outputs/apk/release/app-release.apk
