<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="24" height="24">
    <h1>Adlull</h1>
    <label class="switch" title="전체 보호 켜기/끄기">
      <input type="checkbox" id="enabled">
      <span></span>
    </label>
  </header>

  <section class="status" id="status">
    <div class="shield" id="shield">🌙</div>
    <div id="statusText">보호 중</div>
    <div class="host" id="host"></div>
  </section>

  <section class="stats">
    <div><strong id="network">0</strong><span>차단된 요청</span></div>
    <div><strong id="cosmetic">0</strong><span>숨긴 광고</span></div>
    <div><strong id="total">–</strong><span>누적 차단</span></div>
  </section>

  <section class="actions">
    <label class="row">
      <span>이 사이트에서 보호</span>
      <span class="switch small"><input type="checkbox" id="siteToggle"><span></span></span>
    </label>
    <button id="pick">🎯 요소 선택해서 숨기기</button>
    <button id="options" class="ghost">⚙️ 설정 및 사용자 필터</button>
  </section>

  <script src="popup.js" type="module"></script>
</body>
</html>
